name: Release Evidence Gate

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  release-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Execute the trusted gate from the protected base branch, not PR-authored code.
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Validate public release attestation
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: node scripts/release_evidence_gate.js
      - name: Test release evidence gate
        run: node scripts/test_release_evidence_gate.js
