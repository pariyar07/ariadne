name: Validate Repo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Run repository guardrails
        run: node scripts/validate_repo.js
      - name: Run repository guardrail mutation suite
        run: node scripts/test_validate_repo.js
      - name: Run workspace instructions behavior suite
        run: node skills/workspace-instructions/test/test_workspace_instructions.js
      - name: Run validator test suite
        run: node skills/validator/test/test_recursive_scopes.js
      - name: Run vault registration test suite
        run: node skills/vault/test/test_register_vault.js
