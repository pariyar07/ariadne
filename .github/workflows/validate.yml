name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run validator test suite
        run: node skills/obsidian-vault-validator/test/test_recursive_scopes.js
      - name: Run vault registration test suite
        run: node skills/obsidian-agentic-vault/test/test_register_vault.js
